workflows:
  ios-build:
    name: Build iOS Binary
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          brew install cmake libuv openssl
      - name: Build XMRig
        script: |
          # Locate CMakeLists.txt whether it's in root or a subfolder
          if [ -f "CMakeLists.txt" ]; then
            TARGET_DIR="."
          else
            TARGET_DIR=$(dirname $(find . -maxdepth 2 -name "CMakeLists.txt" | head -n 1))
          fi
          
          cd "$TARGET_DIR"
          mkdir -p build && cd build
          
          cmake .. \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) \
            -DWITH_OPENCL=OFF \
            -DWITH_CUDA=OFF
            
          make -j$(sysctl -n hw.ncpu)
    artifacts:
      - "**/build/xmrig"
