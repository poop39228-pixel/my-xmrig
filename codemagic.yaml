workflows:
  ios-build:
    name: Build iOS Binary
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          brew install cmake libuv openssl
      - name: Clone and Build XMRig
        script: |
          git clone https://github.com/xmrig/xmrig.git official-xmrig
          cd official-xmrig
          git clone https://github.com/leetal/ios-cmake.git
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=../ios-cmake/ios.toolchain.cmake -DPLATFORM=OS64 -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_SECURE_JIT=OFF
          make -j$(sysctl -n hw.ncpu)
    artifacts:
      - official-xmrig/build/xmrig
